# Fast tier of the iOS wrap (backlog J3): runs the built bundle through WebKit at
# iPhone viewport on a free Ubuntu runner, in about a minute.
#
# This is the every-push gate. It catches the web-layer failures that would
# otherwise need a ~10-minute macOS simulator run: white screens, asset 404s
# (the `base: './'` class of bug), and JS that only breaks in WebKit. The
# simulator workflow now only fires when the NATIVE surface changes.
#
# It also carries the two gates that used to exist but never ran: unit tests
# now run WITH coverage thresholds, and the axe accessibility suite (Chromium,
# ~20s) runs as a hard failure. Before that, the a11y tests lived in a
# Playwright project CI never started, asserting softly — so no accessibility
# regression could redden a build.
#
# Uses no secrets, so running on pull_request is safe even from forks.
name: WebKit wrapper gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests + coverage thresholds
        run: npm run test:cov

      - name: Build web assets
        run: npm run build

      - name: Assert built asset URLs stay relative
        # Cheap static twin of the runtime check below — absolute /assets/...
        # 404s under capacitor://localhost while the hosted site stays healthy.
        run: |
          set -uo pipefail
          if grep -Eo '(src|href)="/[^/][^"]*"' dist/index.html; then
            echo "::error::dist/index.html has absolute asset paths — these 404 under capacitor://localhost. Restore base:'./' in vite.config.ts."
            exit 1
          fi
          echo "OK: all asset URLs in dist/index.html are relative"

      - name: Install WebKit + Chromium
        run: npx playwright install --with-deps webkit chromium

      - name: WebKit wrapper gate
        run: npm run test:webview

      # Accessibility gate. Chromium-only and ~20s, so it rides along here
      # rather than earning its own workflow. Serious/critical axe violations
      # fail the build; the screenshot project stays out of CI (no baselines).
      - name: Accessibility gate (axe)
        run: npm run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/
          if-no-files-found: ignore
